[package]
name = "orchestrator-core"
version = "0.1.0"
edition = "2021"
authors = ["AgentMarshal Contributors"]
description = "Core state engine, lock resolution, and agent adapters for AgentMarshal"

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
